<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adcash Test</title>


<script
src="https://acscdn.com/script/aclib.js">
</script>


</head>


<body>


<h1>Hello Test</h1>


<script>

window.addEventListener("load", function(){


    try {


        if(
            window.aclib &&
            typeof window.aclib.runAutoTag === "function"
        ){

            window.aclib.runAutoTag({

                zoneId:"ydqubl9osj"

            });


            console.log(
                "Adcash started"
            );


        }else{


            console.log(
                "aclib not ready"
            );


        }


    }catch(e){


        console.log(
            "Adcash Error:",
            e
        );


    }


});


</script>


</body>

</html>
