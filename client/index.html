<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Test</title>


</head>


<body>


<h1>Hello Test</h1>



<!-- Adcash -->
<script>

(function(){

    var loaded = false;


    function startAdcash(){


        if(loaded){
            return;
        }


        loaded = true;


        var s = document.createElement("script");


        s.src = "https://acscdn.com/script/aclib.js";


        s.async = true;


        s.onload = function(){


            try{


                if(
                    typeof window.aclib !== "undefined" &&
                    typeof window.aclib.runAutoTag === "function"
                ){

                    window.aclib.runAutoTag({

                        zoneId:"ydqubl9osj"

                    });

                }


            }catch(err){


                console.log(
                    "Adcash Error:",
                    err
                );


            }


        };


        s.onerror=function(){

            console.log(
                "Adcash Script Load Failed"
            );

        };


        document.body.appendChild(s);


    }



    if(
        document.readyState === "complete"
    ){

        startAdcash();

    }else{


        window.addEventListener(
            "load",
            startAdcash
        );


    }


})();


</script>


</body>

</html>
